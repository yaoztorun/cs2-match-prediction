    + reports/tables/map_xgboost_v3_final_group_importance.csv (Phase 6D, reused unmodified)
  product_factor_groups:
  - event_context
  - map_experience
  - map_pool
  - opponent_strength
  - overall_strength
  - player_strength
  - recent_form
  - roster_map_familiarity
  - roster_stability
  - selected_map_strength
  family_to_product_group:
    A: overall_strength
    B: map_pool
    C: map_pool
    D: map_pool
    E: opponent_strength
    F: recent_form
    G: recent_form
    H: player_strength
    I: roster_stability
    J: roster_stability
    K: selected_map_strength
    L: event_context
    M: map_experience
    N: map_experience
    O: roster_map_familiarity
    P: roster_map_familiarity
  features:
  - model_id: map_xgboost_v3_final
    transformed_feature: elo_diff
    family: A
    family_label: original series V1 (ELO / win rate / activity)
    factor_group: overall_strength
    factor_group_rationale: original series V1 signal (ELO/win-rate/activity), reused
      unchanged as raw input to the known-map model.
  - model_id: map_xgboost_v3_final
    transformed_feature: roster_mean_kast_diff
    family: H
    family_label: player performance
    factor_group: player_strength
    factor_group_rationale: individual player performance statistics (ADR/KAST/KD/assists).
  - model_id: map_xgboost_v3_final
    transformed_feature: avg_opponent_elo_last_10_diff
    family: E
    family_label: opponent-strength / residual form
    factor_group: opponent_strength
    factor_group_rationale: opponent-strength / residual form (strength of schedule,
      over/under-performance vs. ELO-expected outcome).
  - model_id: map_xgboost_v3_final
    transformed_feature: time_weighted_map_opponent_elo_diff
    family: M
    family_label: recent/opponent-adjusted selected-map team features
    factor_group: map_experience
    factor_group_rationale: recency- and opponent-adjusted selected-map TEAM features
      - a comparative/contextual view of map performance, distinct from K's raw strength
      numbers.
  - model_id: map_xgboost_v3_final
    transformed_feature: map_pool_best_elo_diff
    family: B
    family_label: map-pool depth and order statistics
    factor_group: map_pool
    factor_group_rationale: map-pool depth and order statistics (breadth/quality of
      the team's map pool).
  - model_id: map_xgboost_v3_final
    transformed_feature: map_pool_total_matches_diff
