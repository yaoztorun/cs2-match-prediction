config_version: application_explanation_feature_groups_v1
note: Every transformed feature actually consumed by each frozen model maps to exactly
  one product factor_group - no silently unmapped model features (verified programmatically
  before this file was written, not asserted).
rf_v2:
  model_id: series_random_forest_v2
  raw_feature_count: 17
  transformed_feature_count: 19
  product_factor_groups:
    overall_strength: Overall team strength (ELO, all-time win rate).
    recent_performance: Recent-form performance, activity, and rest.
    historical_experience: How much historical data exists for this matchup.
    event_context: Series format and tournament tier context.
  factor_groups_not_applicable_to_this_model:
  - opponent_strength
  - map_pool
  - selected_map_strength
  - map_experience
  - player_strength
  - roster_stability
  - roster_map_familiarity
  features:
  - model_id: series_random_forest_v2
    raw_feature: elo_diff
    transformed_feature: elo_diff
    factor_group: overall_strength
    display_label: ELO rating difference
    description: Difference in each team's overall ELO rating.
    direction_semantics: higher_favors_team_a
  - model_id: series_random_forest_v2
    raw_feature: overall_win_rate_diff
    transformed_feature: overall_win_rate_diff
    factor_group: overall_strength
    display_label: Overall win-rate difference
    description: Difference in each team's smoothed all-time win rate.
    direction_semantics: higher_favors_team_a
  - model_id: series_random_forest_v2
    raw_feature: win_rate_last_5_diff
    transformed_feature: win_rate_last_5_diff
    factor_group: recent_performance
    display_label: Last-5-match win-rate difference
    description: Difference in each team's win rate over its last 5 series.
    direction_semantics: higher_favors_team_a
  - model_id: series_random_forest_v2
    raw_feature: win_rate_last_10_diff
    transformed_feature: win_rate_last_10_diff
    factor_group: recent_performance
    display_label: Last-10-match win-rate difference
    description: Difference in each team's win rate over its last 10 series.
    direction_semantics: higher_favors_team_a
  - model_id: series_random_forest_v2
    raw_feature: format_win_rate_diff
    transformed_feature: format_win_rate_diff
    factor_group: recent_performance
    display_label: Format-specific win-rate difference
    description: Difference in each team's win rate at this series' best-of format.
    direction_semantics: higher_favors_team_a
  - model_id: series_random_forest_v2
    raw_feature: avg_series_margin_last_5_diff
    transformed_feature: avg_series_margin_last_5_diff
    factor_group: recent_performance
    display_label: Last-5 average series margin difference
    description: Difference in each team's average map-score margin over its last
      5 series.
    direction_semantics: higher_favors_team_a
  - model_id: series_random_forest_v2
    raw_feature: avg_series_margin_last_10_diff
    transformed_feature: avg_series_margin_last_10_diff
    factor_group: recent_performance
    display_label: Last-10 average series margin difference
    description: Difference in each team's average map-score margin over its last
      10 series.
    direction_semantics: higher_favors_team_a
  - model_id: series_random_forest_v2
    raw_feature: matches_last_30_days_diff
    transformed_feature: matches_last_30_days_diff
    factor_group: recent_performance
    display_label: Recent activity difference
    description: Difference in how many series each team played in the last 30 days.
    direction_semantics: context_dependent
  - model_id: series_random_forest_v2
    raw_feature: days_since_last_match_diff
    transformed_feature: days_since_last_match_diff
    factor_group: recent_performance
    display_label: Rest/inactivity difference
    description: Difference in days since each team's last series.
    direction_semantics: context_dependent
  - model_id: series_random_forest_v2
    raw_feature: total_matches_before_diff
    transformed_feature: total_matches_before_diff
    factor_group: historical_experience
    display_label: Total prior match-count difference
    description: Difference in each team's total historical series count.
    direction_semantics: context_dependent
  - model_id: series_random_forest_v2
    raw_feature: history_matches_min
    transformed_feature: history_matches_min
    factor_group: historical_experience
    display_label: Minimum historical match count
    description: The smaller of the two teams' historical series counts (data-sufficiency
      signal, not team-specific).
    direction_semantics: neutral_confidence
  - model_id: series_random_forest_v2
    raw_feature: history_matches_sum
    transformed_feature: history_matches_sum
    factor_group: historical_experience
    display_label: Combined historical match count
    description: The sum of both teams' historical series counts (data-sufficiency
      signal).
    direction_semantics: neutral_confidence
  - model_id: series_random_forest_v2
    raw_feature: both_teams_have_history
    transformed_feature: both_teams_have_history
    factor_group: historical_experience
    display_label: Both teams have any history
    description: Whether both teams have at least one prior series (confidence flag).
    direction_semantics: neutral_confidence
  - model_id: series_random_forest_v2
    raw_feature: both_teams_have_5_matches
    transformed_feature: both_teams_have_5_matches
    factor_group: historical_experience
    display_label: Both teams have >=5 matches
    description: Whether both teams have at least 5 prior series (confidence flag).
    direction_semantics: neutral_confidence
  - model_id: series_random_forest_v2
    raw_feature: both_teams_have_10_matches
    transformed_feature: both_teams_have_10_matches
    factor_group: historical_experience
    display_label: Both teams have >=10 matches
    description: Whether both teams have at least 10 prior series (confidence flag).
    direction_semantics: neutral_confidence
  - model_id: series_random_forest_v2
    raw_feature: bestOf
    transformed_feature: bestOf_BO3
    factor_group: event_context
    display_label: Series format
    description: The series best-of format (1/3/5).
    direction_semantics: categorical
  - model_id: series_random_forest_v2
    raw_feature: bestOf
    transformed_feature: bestOf_BO5
    factor_group: event_context
    display_label: Series format
    description: The series best-of format (1/3/5).
    direction_semantics: categorical
  - model_id: series_random_forest_v2
    raw_feature: tier
    transformed_feature: tier_tier2
    factor_group: event_context
    display_label: Tournament tier
    description: The series' tournament tier.
    direction_semantics: categorical
  - model_id: series_random_forest_v2
    raw_feature: tier
    transformed_feature: tier_tier3
    factor_group: event_context
    display_label: Tournament tier
    description: The series' tournament tier.
    direction_semantics: categorical
map_xgboost_v3_final:
  model_id: map_xgboost_v3_final
  transformed_feature_count: 131
