development_vs_external_event_policy:
  dev_validation_context:
    accuracy: 0.6068
    brier: 0.2298
    log_loss: 0.6514
    note: Frozen BEFORE Cologne, on chronologically later development validation data.
      Shown as context only - never reinterpreted or used to re-select a model.
    phase: phase4_logistic_regression_and_rf_v2_selection
    roc_auc: 0.6566
  rule: Never call the difference between Phase 4 development validation and Cologne
    'improvement' or 'degradation' without qualification (sample size, opponent distribution,
    BO distribution, and tournament composition all differ, and Cologne is one event).
    Use 'external-event metric difference' wording, e.g. 'Cologne external-event AUC
    was X, compared with 0.6566 on the earlier chronological development validation.'
    The prior model-selection decision is never reinterpreted.
event_id: iem_cologne_major_2026
exact_lookup_policy:
  forbidden:
  - orientation reversal fallback
  - approximate team matching
  - symmetrization
  - probability averaging
  - recomputation/re-inference
  key: (team_a, team_b, best_of) against data/evaluation/cologne_2026_pre_event_matchup_probabilities_v1.parquet
  requirement: 106/106 exact successful lookups required.
  stop_condition: If an exact lookup fails for any actual match, STOP.
favorite_path_comparison_policy:
  rule: 'Keep ACTUAL-MATCH MODEL ACCURACY strictly distinct from DETERMINISTIC FAVORITE-PATH
    SIMILARITY. Never report ''X/106 path matches correct'' past the point the deterministic
    path diverges from reality. Compare at the structural level instead: Stage-1 advancer
    set, Stage-2 advancer set, Stage-3/playoff set, semifinalist set, finalist set,
    champion. Individual match predictions are only compared where the exact same
    matchup occurs in both the deterministic path and reality - divergent downstream
    matchups are never penalized as if they were wrong predictions.'
figures:
  list:
  - 01 pre-event championship probabilities, actual champion highlighted
  - 02 pre-event playoff probabilities, actual playoff teams marked
  - 03 predicted vs actual tournament progression matrix
  - 04 top-8 predicted playoff teams vs actual playoff teams
  - 05 match-level confusion matrix
  - 06 match-level ROC curve
  - 07 actual-winner probability distribution
  - 08 match log loss / accuracy by stage
  - 09 stage advancement prediction vs reality
  - 10 Swiss actual-record probability matrix
  - 11 model-favorite path vs actual progression
  - 12 compact simulation-vs-reality presentation summary
  provenance_policy_amendment_21: Every figure is generated downstream only from the
    canonical actual-results artifact, the actual-match predictions artifact, milestone/metric
    tables, and frozen Phase 8D aggregates. No figure script opens the RF model, runs
    the tournament engine, reads raw match data, or accesses the network - statically
    checked (AST import guard) where practical.
  tooling: 'matplotlib only, no seaborn. High-resolution PNG + PDF (300 DPI, mirroring
    phase8d_figures.py''s _save() helper and palette: BAR_COLOR=#2b6cb0, ACCENT_COLOR=#c05621,
    GRID_COLOR=#d9d9d9, cmap=Blues for heatmaps).'
