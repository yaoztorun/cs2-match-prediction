# ---------------------------------------------------------------------------
# Feature-engineering constants (fixed by design, restated for lineage; NOT
# tuned anywhere in Phase 6C).
# ---------------------------------------------------------------------------
constants:
  elo_k: 32.0
  map_pool_lookback_days: 180
  experienced_map_min_matches: 5
  form_half_life_days: 60.0
  roster_lookback_days: 90.0
  player_form_half_life_days: 60.0
  roster_size: 5
  min_rounds_for_valid_map: 5
  map_form_half_life_days: 90.0   # Phase 6C's new selected-map recency constant, NOT tuned

# ---------------------------------------------------------------------------
# Cold-start contract - restates map_features_v2_rich's contract by reference
# (unchanged for every inherited column) and documents Phase 6C's own new
# features. Values are genuinely MISSING (NaN) only where explicitly
# documented below, NEVER a fabricated neutral number to force finiteness. A
# feature's NaN must always be explainable by its paired confidence/evidence
# feature reading zero. DIFFERENCE-style features (never ratios) use 0.0 as
# their cold-start neutral, per the Phase 6C approval corrections.
# ---------------------------------------------------------------------------
cold_start:
  inherited_v2_contract: see config/map_features_v2_rich.yaml - unchanged for every inherited column
  weighted_map_wr: 0.5                       # Beta(2,2) smoothing naturally reduces to 0.5 with zero history
  weighted_map_margin: 0.0
  weighted_map_performance_residual: 0.0      # trusted-opponent population only; 0.0 = no adjusted evidence
  weighted_map_opponent_elo: 1500.0           # trusted-opponent population only
  map_recent_history_mass: 0.0
  map_adjusted_history_mass: 0.0              # trusted-opponent-only mass (Phase 6C correction #3)
  selected_map_elo_vs_overall: 0.0            # DIFFERENCE, not a ratio - never NaN, never a ratio fallback
  selected_map_elo_vs_pool_mean: 0.0          # DIFFERENCE - well-defined even when the pool is empty (both
                                               # sides default to 1500.0, so the difference is 0.0)
  selected_map_wr_vs_pool_mean: 0.0           # DIFFERENCE
  selected_map_rank_percentile: 0.5           # neutral rank when the map is absent from the team's recent
                                               # pool, or the pool itself is empty - paired with
                                               # selected_map_in_both_recent_pools
  roster_map_performance_diffs: null          # genuinely MISSING - NaN exactly where
                                               # roster_map_players_with_history_min == 0 (roster_map_mean_kast_diff,
                                               # roster_map_bottom_kast_diff, roster_map_mean_adr_diff,
                                               # roster_map_mean_kd_balance_diff ONLY)
  roster_map_mean_history_mass: 0.0
  roster_map_kast_specialization: 0.0         # DIFFERENCE, per-player neutral 0.0 when either the map-specific
                                               # or global KAST evidence is missing for that player (never NaN,
                                               # per the Phase 6C approval corrections) - so the roster-level
                                               # mean is always finite
  current_core_map_continuity: 0.0
  current_core_map_history_mass: 0.0
  no_fabrication: >
    No feature in this dataset is ever imputed with a population-wide mean to
    force finiteness. A cold-start row is always distinguishable from a
    well-evidenced one via its paired confidence/count/mass feature.
  no_map_slot: >
    The Phase 6C map-order audit (reports/phase6c_modern_map_feature_engineering.md)
    found that every map of a series shares one identical raw `datetime` in
    this dataset - there is no independent timestamp against which `game_id`
    order can be validated as true chronological map-play order. Per the
    Phase 6C approval corrections, map order is therefore reported as
    "cannot be independently verified" and NO `map_slot` categorical context
    is added.

# Columns that must NEVER appear as predictors in this dataset. Identical to
# map_features_v2_rich.yaml's list, restated for lineage.
forbidden_columns:
  - score1_game
  - score2_game
  - map_id
  - kills
  - deaths
  - assists
  - adr
  - kast
  - kddiff
  - any player id or player name column
  - the target series' actual lineup in any form
  - any per-map result of the target map
  - any result of the target series
  - team1_win
  - team1_series_win (as a predictor - it is V4's own target, never carried through as a feature)
