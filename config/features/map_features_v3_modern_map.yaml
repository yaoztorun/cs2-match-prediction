# Phase 6C - MODERN SELECTED-MAP feature whitelist (data/features/map_features_v3_modern_map.parquet).
#
# Single source of truth for which columns are legitimate model inputs.
# scripts/validate_phase6c.py checks the real parquet against this file.
# Hand-specified whitelist - NEVER "every numeric column".

metadata:
  task_id: map_features_v3_modern_map
  prediction_task: known_map   # documentation/config metadata, NOT a predictive feature
  modern_map_engine_version: "1.0.0"
  granularity: one row per historical map (match_id + game_id) - the same 10,318 rows as map_features_v2_rich
  description: >
    Extends map_features_v2_rich (Phase 6A) with RECENT/opponent-adjusted
    selected-map performance, selected-map strength relative to a team's
    general strength, and CURRENT-inferred-roster experience on the selected
    map - the response to Phase 6B's finding that the known-map model relied
    more on broad strength/form than on exact selected-map history. Every
    map_features_v2_rich column is preserved value-for-value; 25 new features
    are appended (18 directional + 7 symmetric/confidence). No `map_slot`
    context is added - the Phase 6C map-order audit found no independent
    signal (every map of a series shares one identical raw `datetime` in this
    dataset) against which `game_id` order could be verified as true
    chronological play order; see reports/phase6c_modern_map_feature_engineering.md.
  relationship_to_map_v2: >
    Every map_features_v2_rich row is preserved: same 10,318 rows, same
    order, same target, every V2 column unchanged. Nothing is dropped or
    recomputed.
  prediction_cutoff: >
    series_datetime - unchanged from V2. Every new feature here is filtered
    strictly prior to this cutoff, using either a properly time-batched
    replay of the frozen map_feature_engine.MapStateStore (raw per-team
    map_elo, needed for the map-vs-overall/map-vs-pool comparisons) or
    query-time `< as_of` filtering over flat, order-independent ledgers (the
    two new player/team selected-map history stores) - see
    scripts/modern_map_feature_engine.py's module docstring for the proof.

target:
  team1_map_win

