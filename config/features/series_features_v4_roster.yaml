# Phase 5C - PRE-VETO series feature whitelist
# (data/features/series_features_v4_roster.parquet).
#
# Single source of truth for which columns are legitimate model inputs.
# scripts/validate_phase5c.py checks the real parquet against this file.
# Hand-specified whitelist - NEVER "every numeric column".

metadata:
  task_id: series_features_v4_roster
  prediction_task: pre_veto_series  # documentation/config metadata, NOT a predictive feature
  player_roster_engine_version: "1.0.0"
  granularity: one row per series (match_id) - the same 9,456 match_ids as V1/V2/V3
  description: >
    Extends V3 (series_features_v3_form) with leakage-safe player-form and
    roster-stability features. The expected lineup of each team is INFERRED
    from that team's strictly-prior appearances only; the target series'
    actual lineup and box score are never inputs. Individual player form is
    tracked per persistent player_id and therefore follows a player across
    team transfers, while team membership does not transfer until the player
    is actually observed playing for the new team.
  relationship_to_v3: >
    Strict superset of series_features_v3_form: identical match_id universe,
    identical targets, identical row ordering, every V3 feature column
    preserved unchanged. Player/roster columns are appended.
  prediction_cutoff: >
    datetime - the AUTHORITATIVE series start taken from the canonical series
    source, joined onto every map/player observation of that match_id. Map
    timestamps are provenance only and never widen what a series may see.

target:
  team1_series_win

# ---------------------------------------------------------------------------
# TWO DISTINCT STATE CONCEPTS - do not describe them interchangeably
# ---------------------------------------------------------------------------
feature_family_semantics:
  global_player_performance_state: >
    Keyed by persistent player_id. A player's individual form (ADR, KAST,
    KD-balance, assists-per-round) FOLLOWS THE PLAYER across team changes, so
    a transfer never erases their history. Updates whenever that player's box
    score is usable, independent of either team's identity eligibility - the
    player's own performance is a real fact about the player.
  team_roster_appearance_state: >
    Keyed by canonical team identity. Records which players have recently
    REPRESENTED THAT TEAM, and is the only thing expected-roster inference and
    the stability features read. Team membership does NOT transfer with a
    player: a transferred player enters the new team's inferred roster only
    after actually appearing for it. Updates only when that canonical team is
    identity-eligible, like every other team-keyed state in this project.
  expected_roster_inference: >
    Top ROSTER_SIZE players for the team by recency-weighted appearance mass
    over [T - roster_lookback_days, T), tie-broken by most recent appearance
    then by lowest player_id. Fewer than five available -> use what exists;
    players are NEVER fabricated.
  why_the_target_lineup_is_forbidden: >
    (a) the application asks a user to choose two TEAMS, not ten player ids,
    so a feature depending on the real lineup could not be reproduced at
    inference time; and (b) this repo's standing ruling (reports/data_audit.md
    open question 2, reports/leakage_analysis.md) is that the lineup columns
    may be a post-hoc box-score roster including substitutions and must be
    treated as leaky by default until the collection method is confirmed.

# Directional features - negate exactly under a Team1<->Team2 swap.
directional_features:
  # --- new: player form over the inferred roster (Phase 5C) ---
  - roster_mean_adr_diff
  - roster_top_adr_diff
  - roster_bottom_adr_diff
  - roster_mean_kast_diff
  - roster_top_kast_diff
  - roster_bottom_kast_diff
  - roster_mean_kd_balance_diff
  - roster_top_kd_balance_diff
  - roster_bottom_kd_balance_diff
  - roster_mean_assists_per_round_diff
  # --- new: roster stability (Phase 5C) ---
  - recent_unique_players_10_maps_diff
  - recent_unique_players_20_maps_diff
  - core5_appearance_concentration_90d_diff
  - core5_continuity_last_10_diff
  # --- new: player-history evidence (Phase 5C) ---
  - roster_mean_player_history_mass_diff
  # --- inherited Phase 5B.2 opponent-adjusted / recency-aware form ---
  - avg_opponent_elo_last_5_diff
  - avg_opponent_elo_last_10_diff
  - performance_residual_last_5_diff
  - performance_residual_last_10_diff
  - performance_residual_all_diff
  - time_weighted_win_rate_diff
  - time_weighted_performance_residual_diff
  - time_weighted_series_margin_diff
  # --- inherited Phase 5A map-pool (family A: pool depth / order statistics) ---
  - map_pool_size_diff
  - map_pool_total_matches_diff
  - map_pool_experienced_maps_diff
  - map_pool_mean_elo_diff
  - map_pool_best_elo_diff
  - map_pool_second_best_elo_diff
  - map_pool_third_best_elo_diff
  - map_pool_worst_elo_diff
  - map_pool_mean_smoothed_wr_diff
  - map_pool_best_smoothed_wr_diff
  - map_pool_second_best_smoothed_wr_diff
  - map_pool_third_best_smoothed_wr_diff
  - map_pool_worst_smoothed_wr_diff
  - map_pool_mean_normalized_margin_diff
  # --- inherited Phase 5A map-pool (family B: same-map matchup) ---
  - map_matchup_mean_elo_advantage
  - map_matchup_median_elo_advantage
  - map_matchup_midrange_elo_advantage
  - map_matchup_positive_advantage_balance
  - map_matchup_mean_smoothed_wr_advantage
  - map_matchup_median_smoothed_wr_advantage
  # --- inherited Phase 3 V1 (unchanged) ---
