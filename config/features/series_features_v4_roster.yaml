  - overall_win_rate_diff
  - win_rate_last_5_diff
  - win_rate_last_10_diff
  - format_win_rate_diff
  - avg_series_margin_last_5_diff
  - avg_series_margin_last_10_diff
  - matches_last_30_days_diff
  - days_since_last_match_diff
  - total_matches_before_diff

# Symmetric features - IDENTICAL under a Team1<->Team2 swap.
symmetric_features:
  # --- new: player/roster confidence (Phase 5C) ---
  - roster_size_min
  - both_teams_have_5_inferred_players
  - roster_min_player_history_mass
  - roster_core_concentration_min
  - roster_core_continuity_last10_min
  - roster_form_players_min
  # --- inherited Phase 5B.2 form confidence ---
  - opponent_adjusted_history_min
  - both_teams_have_5_adjusted_matches
  - both_teams_have_10_adjusted_matches
  - time_weighted_history_mass_min
  # --- inherited Phase 5A map-pool confidence ---
  - map_pool_size_min
  - map_pool_total_matches_min
  - both_teams_have_map_pool_history
  - both_teams_have_3_recent_maps
  - both_teams_have_5_experienced_maps
  - union_map_count
  - shared_recent_map_count
  - shared_experienced_map_count
  - map_matchup_shared_coverage
  - map_matchup_elo_advantage_range
  # --- inherited Phase 3 V1 (unchanged) ---
  - history_matches_min
  - history_matches_sum
  - both_teams_have_history
  - both_teams_have_5_matches
  - both_teams_have_10_matches

categorical_context:
  - bestOf
  - tier

metadata_columns:
  - match_id
  - datetime
  - tournament
  - team1
  - team2
  - team1_canonical
  - team2_canonical
  - source
  - canonical_match_uid

# ---------------------------------------------------------------------------
# Feature-engineering constants (fixed by design, NOT tuned in Phase 5C)
# ---------------------------------------------------------------------------
constants:
  roster_lookback_days: 90.0          # expected-roster inference window - NEVER tuned
  player_form_half_life_days: 60.0    # player-form recency decay - NEVER tuned
  roster_size: 5
  min_rounds_for_valid_map: 5         # sub-5-round rows are forfeits; their per-round rates are meaningless
  form_half_life_days: 60.0           # inherited from V3, restated for lineage
  elo_k: 32.0                         # unchanged from Phase 3 - no K tuning
  map_pool_lookback_days: 180         # inherited from V2, restated for lineage
  experienced_map_min_matches: 5      # inherited from V2, restated for lineage
  beta_prior: [2, 2]                  # inherited from V1/V2, restated for lineage

# ---------------------------------------------------------------------------
# Cold-start contract
# ---------------------------------------------------------------------------
cold_start:
  roster_performance_aggregates: >
    NaN - genuinely MISSING, never a sentinel and never a population-wide
    mean (imputing the dataset-wide ADR/KAST would import information from
    outside the strictly-prior window). Aggregates are computed over the
    inferred roster players that have at least one usable prior observation;
    they are NaN only when NO inferred roster player has any. Invariant
    asserted at build time and re-checked in validate_phase5c.py: the ten
    roster performance diffs are NaN EXACTLY where roster_form_players_min == 0.
  player_history_mass: 0.0            # a true absence of evidence, not "neutral"
  roster_size: 0
  stability_counts_and_ratios: 0      # recent_unique_*, concentration, continuity
  confidence_flags: 0
  no_fabrication: >
    A team with fewer than five prior players never has players invented for
    it, and a player with no prior maps never receives a borrowed statistic.
    roster_size_min, roster_form_players_min and roster_min_player_history_mass
    exist precisely so a neutral/missing value can be distinguished from
    genuinely average performance backed by substantial history.
  roster_size_min_vs_roster_form_players_min: >
    They are different quantities. A team can have five INFERRED players
    (roster_size 5) while only some of them have usable prior box scores
    (roster_form_players_min < 5).

# Columns that must NEVER appear in this dataset.
forbidden_columns:
  - map_name
  - map_id
  - the list, count or order of maps selected in the target match
  - score1_game
  - score2_game
  - any per-map result of the target series
  - the target series' actual player ids or player names
  - the target series' player kills / deaths / assists / adr / kast / kddiff
  - the target series' lineup membership in any form
  - kddiff as a derived input anywhere (100% collinear with kills - deaths)
  - any score, result or lineup information from the TARGET series
    (only strictly-prior history may feed player/roster features)
