# ---------------------------------------------------------------------------
# Swiss format rules (generic Valve rule; frozen verbatim/derived, nothing
# implemented as a running engine)
# ---------------------------------------------------------------------------
swiss_rules:
  teams_per_stage: 16
  advancement_wins: 3
  elimination_losses: 3
  rematch_avoidance: "teams are not to play the same opponent twice in the same stage, if possible"
  initial_matchup_rule: "1v9, 2v10, 3v11, 4v12, 5v13, 6v14, 7v15, 8v16 (seed within the stage)"
  round_2_3_rule: "highest seeded team faces the lowest seeded team available that does not result in a rematch within the stage"
  round_4_plus_rule: "select the top-most row of the priority table below that does not result in a rematch"
  round_4_plus_priority_table_note: "Each row's three pair labels (e.g. 1v6) refer to the relative rank of teams remaining within a same-record pod at that point in the stage, not to stage-entry seed numbers."
  round_4_plus_priority_table:
    # Verbatim from the pinned Valve rulebook. Reference metadata only --
    # not implemented as a running Swiss engine in Phase 8B.
    - {priority: 1, pairs: ["1v6", "2v5", "3v4"]}
    - {priority: 2, pairs: ["1v6", "2v4", "3v5"]}
    - {priority: 3, pairs: ["1v5", "2v6", "3v4"]}
    - {priority: 4, pairs: ["1v5", "2v4", "3v6"]}
    - {priority: 5, pairs: ["1v4", "2v6", "3v5"]}
    - {priority: 6, pairs: ["1v4", "2v5", "3v6"]}
    - {priority: 7, pairs: ["1v6", "2v3", "4v5"]}
    - {priority: 8, pairs: ["1v5", "2v3", "4v6"]}
    - {priority: 9, pairs: ["1v3", "2v6", "4v5"]}
    - {priority: 10, pairs: ["1v3", "2v5", "4v6"]}
    - {priority: 11, pairs: ["1v4", "2v3", "5v6"]}
    - {priority: 12, pairs: ["1v3", "2v4", "5v6"]}
    - {priority: 13, pairs: ["1v2", "3v6", "4v5"]}
    - {priority: 14, pairs: ["1v2", "3v5", "4v6"]}
    - {priority: 15, pairs: ["1v2", "3v4", "5v6"]}

