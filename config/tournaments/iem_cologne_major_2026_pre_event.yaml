# ---------------------------------------------------------------------------
# Map veto procedures -- reference metadata only, not implemented as a
# running veto engine.
# ---------------------------------------------------------------------------
veto_procedures:
  bo1:
    steps:
      - "higher seed team chooses to be Team A or Team B"
      - "Team A removes 2 maps"
      - "Team B removes 3 maps"
      - "Team A removes 1 map"
      - "Team B chooses starting side"
    source_type: generic_valve_rule
  bo3:
    steps:
      - "higher seed team chooses to be Team A or Team B"
      - "Team A removes 1 map"
      - "Team B removes 1 map"
      - "Team A picks map 1"
      - "Team B chooses starting side on map 1"
      - "Team B picks map 2"
      - "Team A chooses starting side on map 2"
      - "Team B removes one map"
      - "Team A removes one map"
      - "Team B chooses starting side on map 3"
    source_type: generic_valve_rule
  bo5:
    status: not_implemented
    source_required: true
    note: "No Cologne-specific or generic BO5 veto procedure was found in any sourced document. Per the approved plan, this does not block the tournament-definition freeze or the pre-veto series simulation (which never consumes veto/map data as a prediction input)."

