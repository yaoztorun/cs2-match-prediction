# ---------------------------------------------------------------------------
# Stage seeding contract (generic Valve rule)
# ---------------------------------------------------------------------------
stage_seeding:
  stage_1: "all 16 teams use their pre-event seed (seeding_vrs_date snapshot)"
  stage_2: "8 direct invitees are seeds 1-8 (pre-event seed); 8 Stage-1 advancers are seeds 9-16 (final Stage-1 seed, via Mid-stage Seed Calculation) -- NOT knowable pre-event, left unassigned here"
  stage_3: "8 direct invitees are seeds 1-8 (pre-event seed); 8 Stage-2 advancers are seeds 9-16 (final Stage-2 seed, via Mid-stage Seed Calculation) -- NOT knowable pre-event, left unassigned here"
  playoffs: "all 8 teams use their final Stage-3 seed (via Mid-stage Seed Calculation) -- NOT knowable pre-event, left unassigned here"
  mid_stage_seed_calculation_order:
    - "current W-L record in the stage"
    - "Difficulty Score in the current stage"
    - "initial seeding of the current stage"
  difficulty_score:
    also_known_as: Buchholz
    definition: "sum of current wins minus sum of current losses, summed over every opponent a team has faced in the stage"
    worked_example: >-
      Team A's prior opponents are 2-0 and 1-1: Difficulty Score = (3 wins - 1 loss) = 2.
      Team B's prior opponents are both 1-1: Difficulty Score = (2 wins - 2 losses) = 0.
      If A and B share the same record, A gets the higher seed (played tougher opponents).
    implemented: false
    note: "frozen as a rule for reference only; not computed in Phase 8B, since it requires in-stage results"

# ---------------------------------------------------------------------------
# Match formats (amendments #7, #8)
# ---------------------------------------------------------------------------
match_formats:
  stage_1:
    default: bo1
    override_rule: "best-of-3 iff this match's winner would advance (3rd win) OR this match's loser would be eliminated (3rd loss)"
    source_type: generic_valve_rule
  stage_2:
    default: bo1
    override_rule: "best-of-3 iff this match's winner would advance (3rd win) OR this match's loser would be eliminated (3rd loss)"
    source_type: generic_valve_rule
  stage_3:
    default: bo3
    override_rule: "ALL matches are best-of-3, regardless of record stakes"
    source_type: cologne_event_override
    source_note: >-
      NOT present in the pinned generic Valve rulebook (which has no
      stage-specific carve-out). Confirmed via 4 independently dated
      pre-event sources published before the 2026-06-02T13:30:00 cutoff --
      see data/tournaments/iem_cologne_major_2026_sources.json
      (fact_id: cologne_stage3_bo3_override).
  playoffs:
    quarterfinal: {best_of: 3, source_type: generic_valve_rule}
    semifinal: {best_of: 3, source_type: generic_valve_rule}
    grand_final:
      best_of: 5
      source_type: cologne_event_override
      source_note: >-
        NOT present in the pinned generic Valve rulebook (which treats all
        single-elimination matches, including the final, as best-of-three
        with no Grand Final exception). This is an event/Major-era-specific
        override -- best-of-5 Grand Finals were used for the first time at
        the immediately preceding Major (StarLadder Budapest Major 2025)
        and continued at Cologne. Confirmed via a dated pre-event source
        (escharts.com, published 2026-05-26, before the cutoff) that states
        the complete stage-by-stage and playoff format including
        "The Grand Final is Bo5" -- see
        data/tournaments/iem_cologne_major_2026_sources.json
        (fact_id: cologne_grand_final_bo5_override). This fact is required
        for simulation and is NOT left unresolved.
    third_place_match: none

