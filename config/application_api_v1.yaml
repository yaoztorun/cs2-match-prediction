# Phase 9D application API configuration. Application-infrastructure only -
# never a model/state/context selector. CORS defaults are dev-friendly and
# explicitly NOT `*` combined with allow_credentials (never ship an
# allow-all-origins + credentials-enabled default).

api_version: v1
prediction_contract: phase9b
explanation_version: application_explanations_v1
default_context_id: deployment_post_cologne_v1

cors:
  allow_origins:
    - http://localhost:3000
  allow_credentials: false
  allow_methods: ["GET", "POST"]
  allow_headers: ["*"]

teams_search:
  default_limit: 50
  max_limit: 200
